name: Android Build (UNI X)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble arm64-v8a release APK
    runs-on: ubuntu-latest

    # All secrets are injected here as env vars, read by app/build.gradle.kts
    # via System.getenv(...) at build time. Nothing is ever committed.
    #
    # Currency/geo lookup uses ipapi.co, which needs no API key — nothing
    # to configure for that part.
    #
    # Optional, only needed for a properly SIGNED release APK (otherwise
    # release builds are unsigned, which is fine for CI verification but
    # not for distribution):
    #   KEYSTORE_BASE64         `base64 -w0 your.keystore` output
    #   KEYSTORE_PASSWORD
    #   KEY_ALIAS
    #   KEY_PASSWORD
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_PATH: ${{ github.workspace }}/release.keystore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Uses the action's own managed Gradle install, so the repo does not
      # need to ship a gradle-wrapper.jar binary. Also caches ~/.gradle
      # between runs to keep CI fast.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Only writes the keystore file if the secret is actually configured,
      # so forks / repos without signing secrets still build (unsigned).
      # NOTE: `secrets` cannot be referenced directly in an `if:` — GitHub
      # only evaluates env/vars/github/etc. contexts there. That's why
      # KEYSTORE_BASE64 is promoted to a job-level env var above; this step
      # checks `env.KEYSTORE_BASE64`, not `secrets.KEYSTORE_BASE64`.
      - name: Decode signing keystore (if configured)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

      - name: Lint (non-blocking)
        run: gradle lintDebug --stacktrace
        continue-on-error: true

      - name: Build release APK (arm64-v8a only)
        run: gradle assembleRelease --stacktrace

      - name: Locate APK
        id: locate
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: unix-arm64-release-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error

      - name: Build debug APK (for quick sideload testing)
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: unix-arm64-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Clean up decoded keystore
        if: always()
        run: rm -f "$KEYSTORE_PATH"

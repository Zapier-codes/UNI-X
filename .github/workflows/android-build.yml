name: Android Build (UNI X)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Needed so the release step can create/update a GitHub Release and attach
# the APK using the default GITHUB_TOKEN — no extra secret required.
permissions:
  contents: write

jobs:
  build:
    name: Build & publish release APK
    runs-on: ubuntu-latest

    # All secrets are injected here as env vars, read by app/build.gradle.kts
    # via System.getenv(...) at build time. Nothing is ever committed.
    #
    # Currency/geo lookup uses ipapi.co, which needs no API key — nothing
    # to configure for that part.
    #
    # Optional, only needed for a properly SIGNED release APK (otherwise
    # release builds are unsigned, which is fine to publish for internal
    # testing but not for a real store listing):
    #   KEYSTORE_BASE64         `base64 -w0 your.keystore` output
    #   KEYSTORE_PASSWORD
    #   KEY_ALIAS
    #   KEY_PASSWORD
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_PATH: ${{ github.workspace }}/release.keystore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Uses the action's own managed Gradle install, so the repo does not
      # need to ship a gradle-wrapper.jar binary. Also caches ~/.gradle
      # between runs to keep CI fast.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Only writes the keystore file if the secret is actually configured,
      # so the repo still builds (unsigned) before signing secrets exist.
      # NOTE: `secrets` cannot be referenced directly in an `if:` — GitHub
      # only evaluates env/vars/github/etc. contexts there. That's why
      # KEYSTORE_BASE64 is promoted to a job-level env var above; this step
      # checks `env.KEYSTORE_BASE64`, not `secrets.KEYSTORE_BASE64`.
      - name: Decode signing keystore (if configured)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

      - name: Lint (non-blocking, not published anywhere)
        run: gradle lintDebug --stacktrace
        continue-on-error: true

      # Release only — no debug build, no debug APK. AGP's new Variant API
      # doesn't support renaming outputFileName directly (that mechanism
      # was removed for the new API and never replaced), so this produces
      # whatever AGP's default name is — cleaned up in the next two steps.
      - name: Build release APK (arm64-v8a only)
        run: gradle assembleRelease --stacktrace

      # App name + version live in app/build.gradle.kts as the single
      # source of truth — grepped here rather than duplicated.
      - name: Read app name & version
        id: version
        run: |
          NAME=$(grep -m1 'val appDisplayName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          VERSION=$(grep -m1 'val appVersionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Renames whatever AGP actually produced (e.g. app-release-unsigned.apk)
      # to exactly "<name>-<version>.apk" — nothing more, nothing less. Doing
      # this as a plain `mv` here, instead of fighting AGP's Variant API
      # internals in build.gradle.kts, has zero AGP-version risk.
      - name: Rename APK
        id: locate
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$SRC" ]; then
            echo "No release APK found" >&2
            exit 1
          fi
          DEST="app/build/outputs/apk/release/${{ steps.version.outputs.name }}-${{ steps.version.outputs.version }}.apk"
          mv "$SRC" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "Renamed $SRC -> $DEST"

      # No actions/upload-artifact anywhere in this workflow — the APK goes
      # straight to a GitHub Release, not a temporary CI artifact. Pushing
      # the same version again updates that release's asset in place
      # rather than creating a duplicate.
      - name: Publish GitHub Release with APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ steps.version.outputs.name }} ${{ steps.version.outputs.version }}"
          files: ${{ steps.locate.outputs.apk_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up decoded keystore
        if: always()
        run: rm -f "$KEYSTORE_PATH"
